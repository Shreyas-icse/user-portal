<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>YouTube Transcript Extractor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }
        .container {
            max-width: 700px;
        }
        .card {
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #google_translate_element {
            position: absolute;
            top: 15px;
            right: 15px;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            height: auto;
            min-height: 300px;
            max-height: 450px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- Google Translate Widget -->
    <div id="google_translate_element"></div>

    <div class="container">
        <div class="card p-4">
            <h1 class="text-center mb-4">YouTube Transcript Extractor</h1>

            <form method="post" class="mb-3">
                <div class="input-group">
                    <input type="text" class="form-control" name="url" placeholder="Enter YouTube video URL" required />
                    <button class="btn btn-primary" type="submit">Get Transcript</button>
                </div>
            </form>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            {% if transcript %}
                <h4 class="mt-4">Transcript</h4>
                <pre class="form-control" readonly>{{ transcript }}</pre>
            {% endif %}
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                { pageLanguage: 'en' },
                'google_translate_element'
            );
        }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
